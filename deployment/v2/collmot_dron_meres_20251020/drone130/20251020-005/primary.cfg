# This is the main ini file for flockctrl.
# In each section, parameters can be defined in the following formats:
#
# param1=value1
# param2{id1, id2, -id3, id4-, id5-id6, board-id1}=value2
# param2{!id1, id2, -id3, id4-, id5-id6, board-id1}=value2
# param3=@path-to-file
#
# In the first example param1 will be parsed for all devices.
# In the second example param2 will be parsed only if its device ID is exactly
# id1 or id2 or not larger than id3 or not smaller than id4 or between id5 and
# id6 or have a device board with a given board-id1.
# In the third example we negate the entire example two with '!' at the start.
# In the last example the value of param3 will be parsed from the contents of
# the file given after the "@" character (fill path is relative to config file).
#
# Board ID is always defined in '/etc/flockctrl/board-id'.


[autopilot]

# Type of the autopilot; currently we support "dummy", "pixhawk", "dji_a3" or
# "mavlink_passthru". This setting must come early in the config file so
# subsequent configuration keys could use autopilot.type:pixhawk or
# autopilot.type:dji_a3 to make certain settings dependent on the autopilot
# type
type=pixhawk


[general]

# Vehicle type the device is attached to.
# Possible values: uav, beacon
# For historical reasons, "kopter" is an alias to UAV
vehicle=uav

# Name of the folder that contains the flight logs.
outdir=~/flockctrl-data

# Log mode. Possible values: unicsv, unibin
log_format=unicsv

# Possible values: 'startup', 'algo', 'master', 'master_or_motor'
# If set to 'startup', logging is enabled right upon startup.
# If set to 'algo', logging is enabled/disabled together with
# algo activation/deactivation
# If set to 'master', logging is enabled/disabled with master switch
# If set to 'master_or_motor', logging is disabled only when motors
# and master switch are both off
log_trigger=master_or_motor

# Should we create some basic log for all other boids (1) or not (0)?
log_others=0

# Should we ensure that the UAV is armed right after startup?
# If set to 'off', the UAV will not be armed or disarmed automatically
# after startup.
# If set to 'arm_on_startup', the UAV will be armed automatically after
# startup and will be disarmed automatically after shutdown (unless it is
# airborne).
auto_arm=off

# Shall we allow users to arm or disarm the UAV remotely via commands?
# If set to 'manual', the UAV can only be armed with the safety switch.
# If set to 'remote', the UAV can also be armed remotely.
arming_policy=manual

# Do we require a secondary communication channel (such as a telemetry radio) to
# be present and available on the drone? (1 = yes, 0 = no)
requires_secondary_channel=1


[autopilot.dummy]

# Settings for the dummy autopilot

# Simulated position of the drone when using the dummy autopilot. No simulated
# position is fed into the UAV state if the key is missing.
# position = 47.473485 19.062141 150


[autopilot.pixhawk]

# PixHawk-specific autopilot settings.
# The legacy [pixhawk] section is aliased to this

# Description of the device we use to communicate with the PixHawk.
# We support standard serial ports (UARTs), TCP and UDP connections. For TCP
# and UDP connections, the device description should start with tcp:// or
# udp://, followed by a hostname:port pair. Any other value is interpreted as
# the path to a serial port.
device{odroid-c1}=/dev/ttyS1
device{odroid-c1-linux4}=/dev/ttyAML1
device{odroid-c4}=/dev/ttyAML1
device{rpi-zero-w}=/dev/ttyAMA0

# Baud rate
baud_rate=921600

# Port number via which one can send MAVLink messages to PixHawk directly
# and also monitor the MAVLink messages sent by the PixHawk. The proxy is
# disabled by default; you need to enable it manually during flight by
# sending "pixhawk proxy IP:PORT" as a command to the console, where IP is the
# IP address of the ground station and PORT is the port on which the ground
# station listens for incoming packets. PORT can be omitted and it defaults
# to 14555. Setting proxy_port to zero will disable the proxy port completely.
proxy_port=14555

# Whether the PixHawk instance we are connecting to is a simulated one.
# With a simulated PixHawk, we don't need to ensure that the system ID of the
# PixHawk matches the ID of this UAV.
is_simulated=0

# Zero-based ID of the battery monitor that we use and trust regarding the
# remaining battery percentage and cell voltage data. The default value is
# -1, which means that we do not trust incoming battery percentage and
# cell voltage values. For non-negative values the percentage and cell voltage
# values will be parsed from the corresponding BATTERY_STATUS messages.
# A value of 0 is a special case for which remaining battery percentage will
# also be parsed from the standard SYS_STATUS messages.
# Note that the voltage value of the SYS_STATUS messages is trusted
# at all times, regardless of this setting.
battery_monitor_id=-1

# Default horizontal speed limit enforced on the autopilot in [m/s].
# Try to set a value a bit larger than your maximal expected travel speed
# so that speed error/noise compensation can work smoothly.
# If value is zero, horizontal speed limit is not updated on the autopilot
# during slow flight mode state changes.
velocity_xy=0

# Default sink speed limit enforced on the autopilot in [m/s].
# Try to set a value a bit larger than your maximal expected sink speed
# so that speed error/noise compensation can work smoothly.
# If value is zero, sink speed limit is never updated on the autopilot
# during slow flight mode state changes.
velocity_z_down=0

# Default rise speed limit enforced on the autopilot in [m/s].
# Try to set a value a bit larger than your maximal expected rise speed
# so that speed error/noise compensation can work smoothly.
# If value is zero, rise speed limit is never updated on the autopilot
# during slow flight mode state changes.
velocity_z_up=0


[autopilot.dji_a3]

# DJI A3-specific autopilot settings.

# Description of the serial (UART) device we use to communicate with the A3 OSDK.
device{odroid-c1}=/dev/ttyS1
device{odroid-c1-linux4}=/dev/ttyAML1
device{odroid-c4}=/dev/ttyAML1
device{rpi-zero-w}=/dev/ttyAMA0

# Baud rate
baud_rate=921600

# Description of the USB ACM device we use to communicate with the A3 OSDK.
acm_port=/dev/ttyACM0

# DJI application ID to use
app_id=@dji-a3-app-id

# Application key corresponding to the application ID. Use hex notation.
app_key=@dji-a3-app-key


[autopilot.mavlink_passthru]

# Autopilot settings specific to a transparent MAVLink passthrough.

# Description of the device we use to communicate with the autopilot.
# We support standard serial ports (UARTs), TCP and UDP connections. For TCP
# and UDP connections, the device description should start with tcp:// or
# udp://, followed by a hostname:port pair. Any other value is interpreted as
# the path to a serial port.
device{odroid-c1}=/dev/ttyS1
device{odroid-c1-linux4}=/dev/ttyAML1
device{odroid-c4}=/dev/ttyAML1
device{rpi-zero-w}=/dev/ttyAMA0

# Baud rate
baud_rate=921600

# Port number on which we will listen for incoming MAVLink messages from the GCS.
port=14555

# Port number on which the GCS listens for our MAVLink messages
gcs_port=14550


[bms]

# Type of the battery management system (BMS) handled by flockctrl.
# Currently we support "none", "dummy" and "ktnl".
type=none


[bms.ktnl]

# Description of the device we use to communicate with the KTNL BMS.
# KTNL BMS uses RS-485 directly or over USB.
device=

# Baud rate
baud_rate=38400

# Fully charged voltage of the battery in [V]. Leave the parameter empty
# or set to zero to use default value stored in the BMS itself.
charge_voltage=

# Storage voltage of the battery in [V]. Leave the parameter empty
# or set to zero to use default 88% of charge voltage.
storage_voltage=


[camera_mount]

# Type of the camera mount; currently we support "none", "dummy", "autopilot"
# and "fixed". Type "autopilot" means that the camera mount is handled directly
# by the selected autopilot through its specific methods. Type "fixed" means that
# the camera mount is fixed to the UAV body and the UAV ifself changes its yaw on
# new look at commands.
type=none


[console]

# Whether the debug console is enabled
enabled=1

# IP address that the debug console will bind to. Use 0.0.0.0 for all public
# IP addresses (dangerous if the UAV is accessible via the network while
# airborne) or 127.0.0.1 for localhost only.
ip_address=127.0.0.1

# Port that the debug console will listen on.
port=4242


[jsonrpc]

# Whether the JSON-RPC framework is enabled
enabled=1

# Port that the JSON-RPC framework will listen on.
port=4244


[leds]

# Every LED corresponds to a device (file found in /sys/class/leds) and
# a custom behaviour (heartbeat, error, position, landing, pyro, on, off).
# LED's name is arbitrary. If inverted, LED is on at 0 state and off otherwise.

# Configure position light on ODroid C1+ with Linux kernel 3.x (default)
position.device{odroid-c1}=white:gpio118
position.behaviour{odroid-c1}=position
position.is_inverted{odroid-c1}=1

# Configure position light on ODroid C1+ with Linux kernel 4.x (Armbian)
position.device{odroid-c1-linux4}=c1:white:position
position.behaviour{odroid-c1-linux4}=position
position.is_inverted{odroid-c1-linux4}=1

# TODO: configure position light on ODroid C4

# Configure heartbeat LED on Raspberry Pi Zero W
heartbeat.device{rpi-zero-w}=led0
heartbeat.behaviour{rpi-zero-w}=heartbeat
heartbeat.is_inverted{rpi-zero-w}=1


[led_strip]

# Name of the port where the ledctrl (NanoLED) device is attached.
device{odroid-c1}=/dev/ttyS0
device{odroid-c1-linux4}=/dev/ttyAML0
device{odroid-c4}=/dev/ttyS0
device{rpi-zero-w}=/dev/i2c-1

# I2C slave address (7-bit) if the NanoLED device is attached via I2C. Hex
# notation is also accepted.
i2c_address=0x51

# Baud rate
baud_rate=115200

# Gamma correction factor to apply when emitting colors to this LED strip
gamma=2.2


[lighting]

# Order in which the lighting modules will be executed. The module chain
# should include one or more emitter modules if you actually want to see
# something
modules=base_color, bytecode_player, gcs_override, error, where_are_you, flash, test, emit:led_strip

# Parameters of the modules must be specified in the following form:
# module.parameter=1234

# The default base color that the lighting system emits if there are no other
# colors higher in the chain.
#
# Colors must be specified in CSS notation (e.g,. #ff00ff). Certain color names
# (red, green, blue etc) are also accepted.
#
# Note that this parameter can be changed from a choreography file as well.
# base_color.color = green

# The identifier of the clock that the bytecode player synchronizes to.
# Allowed values are: internal, uptime, motor, algorithm, choreography, midi.
# The list of allowed values depends on the clock identifiers initialized
# in clocks.c. By default we synchronize to the clock of the current
# algorithm.
bytecode_player.clock=algorithm

# If defined, only the given algorithm will allow the bytecode player to play.
# bytecode_player.only_when_algorithm_is=...

# The name of the bytecode file that the bytecode player will play. It must
# contain *binary* ledctrl bytecode that was compiled with the ledctrl
# compiler from a .led or .sce file.
# Note that this parameter can be changed from a choreography file as well.
# bytecode_player.filename=...

# Alternatively, you can specify a static color to use in place of a bytecode
# file. This is useful if you want a light program that shows a single color
# only and you don't want to bother writing a ledctrl file for it.
#
# The difference between setting a base color and setting a color in the
# bytecode player is that the color specified here will be shown only if the
# clock of the bytecode player is running; otherwise the bytecode player will
# let the underlying base color pass through.
#
# Colors must be specified in CSS notation (e.g,. #ff00ff). Certain color names
# (red, green, blue etc) are also accepted.
#
# Note that this parameter can be changed from a choreography file as well.
# bytecode_player.color = green

# Do we enable the bytecode player at all?
# Note that this parameter can be changed from a choreography file as well.
bytecode_player.enable=1

# When emitting the color to the LED strip, should we re-emit it periodically
# even if it hasn't changed? Setting this parameter to zero or a negative
# value would send color instructions to the LED strip only if the color is
# different from the previous one. Setting this parameter to a positive value
# X will attempt to repeat the last color every X seconds even if it has not
# changed. This should be used in conditions where the serial link between the
# LED strip and the controller is not reliable.
emit:led_strip.tx_repeat_period=0


[pyro]

# GPIO pin that will be set to 1 when at least one pyro channel is active.
# This can be used to trigger one-shot pyro effects. Negative numbers mean
# not to use such a pin.
gpio_pin=-1

# Specifies whether the pyro switch fires the pyro immediately (fire) or just
# arms the pyro controller (arm)
pyro_switch_behaviour=arm

# When pyro_switch_behaviour is set to "fire", specifies how many times we
# need to turn the pyro switch on before the pyro is actually fired. Must be
# between 1 and 100, inclusive.
stage=1

# Specifies the minimum altitude above ground below which we do not allow the
# pyro to fire in safe modes.
minimum_altitude=20


[proximity]

# CAUTION: when using a down looking proximity sensor, make sure to set the max
# reliable range to a proper value as otherwise it might happen that over range
# distances are signalled with saturation that might cause a sky rocket in itself
# as an inverse reaction.

# Frontal and down looking proximity sensor enable parameters; objects detected
# by the proximity sensors should be handled the same was as other boids by all
# algorithms. Basic distance kept from objects is defined by the `r0_rep` and
# `r0_offset_spp` parameters at algorithm level (algorithms that implement
# proximity handling so far: waypoint, return_to_home, emergency). When enabling
# the frontal proximity parameter, user must be sure that the drone is facing
# its direction of motion. This can be set up with an auto yaw waypoint command
# in the waypoint algo. In rth and emergency algos, when this parameter is
# enabled, the drone will automatically yaw towards home while flying.
use_front=0
use_down=0

# Minimum AGL altitude below which horizontal proximity readings will not be
# used for avoidance. Set to zero to disable the minimum altitude check.
# Warning: setting has an effect only if a down proximity and thus real AGL
# reading is available.
minimum_altitude=0


[sprayer]

# Type of the sprayer; currently we support "none", "dummy", "autopilot" and
# "spr_hw04". Type "autopilot" means that the sprayer is handled directly by the
# selected autopilot through its "set_sprayer_state" method.
type=none

# Specifies whether the sprayer switch turns the sprayer on (set)
# or just arms/enables the sprayer controller (arm).
sprayer_switch_behaviour=arm


[sprayer.spr_hw04]

# Description of the device we use to communicate with the sprayer.
# We support standard serial ports (UARTs).
device{odroid-c1}=/dev/ttyS0
device{odroid-c1-linux4}=/dev/ttyAML0
device{odroid-c4}=/dev/ttyAML0

# Baud rate
baud_rate=9600

# Motor spin rate to set while spraying in the range of 0-20000 [RPM]
motor_rpm=5000

# Flow rate to set while spraying in the range of 0-5000 [ml/min]
flow_rate=500

# Flow rate offset to set as a calibration value between -500-499 [ml/min].
# Leave it as an empty string to disable updating the flow rate offset.
flow_rate_offset=


[gpio]

# Note: on odroid U3 there are three available gpio pins: 199, 200, 204
# Note: on odroid C1+ there are more: (83), 87, 88, 97, 98, 99, 100, 108, 118
# Note: pyro and aeki GPIO handling is done in separate sections


# Number of the GPIO pin on which we can observe a reset/halt signal.
# Negative numbers mean not to watch the reset/halt pin.
reset_halt_gpio_pin=-1

# Whether we should watch for a rising or falling edge on the GPIO pin.
# Possible values are: rising, falling
reset_halt_edge=falling

# Length of the debounce period when monitoring the GPIO pin, in milliseconds.
# Default: 100 msec for dirty signal (button), 0 ms for clean signal (no delay)
reset_halt_debounce=100


[timesync]

# Whether to debug the PPS pulses by flashing the LED lights if a pulse arrives.
# Valid PPS pulses produce green flashes, invalid PPS pulses produce red flashes.
debug=0

# Number of the GPIO pin on which we can observe the GPS timesync PPS. Negative
# numbers mean not to watch the timesync pulse.
gpio_pin{odroid-c1}=88
gpio_pin{odroid-c1-linux4}=88
gpio_pin{odroid-c4}=479
gpio_pin{rpi-zero-w}=27

# Whether we should watch for a rising or a falling edge on the GPIO pin.
# Possible values are: rising or falling
gpio_edge=rising

# Length of the debounce period when monitoring the GPIO pin, in milliseconds.
# Default: 100 msec for dirty signal (button), 0 ms for clean signal (no delay)
gpio_debounce=0

# Whether to trigger an error state if the GPIO monitor framework was not
# initialized successfully
require_pps=0

# Whether to trigger an error state if the PPS signal is noisy and there are
# too many invalid ticks in a short period of time
warn_invalid_pps=0

# Define the clock that will be included in status packets for monitoring and
# synchronization purposes.
#
# Possible values: internal, uptime, motor, choreography, algorithm, midi.
# "algo" and "choreo" are accepted as legacy aliases.
clock_in_status_packet=motor


[aeki]

# AEKI GM measurements will be performed with the following two GM counters:
#
# ZP1210 - high sensitivity GM unit (0.0003 – 10 mGy/h)
# ZP1300 - low sensitivity GM unit (0.1 – 10000 mGy/h)
#
# For each device defined (with an arbitrary name in less than 10 characters),
# one should provide the following list of parameters:
#
# 'gpio_pin' is the number of the GPIO pin on which we can observe a
#   GeigerMuller counter signal. Negative numbers mean not to watch the gm pin.
#   On Odroid U3 we use gpio199 and gpio200.
#
# 'gpio_edge' defines whether we should watch for a rising or falling edge on
#   the GPIO pin. Possible values are: rising, falling
#
# 'gpio_debounce' defines the ength of the debounce period when monitoring the
#   GPIO pin, in milliseconds. Default: 100 msec for dirty signal (button),
#   0 ms for clean signal (no delay).
#
# 'gpio_mode' defines the monitoring mode of the aeki gpio pin.
#   Possible values: event, counter, event_and_counter
#
# 'sensitivity' represent the polynomial coefficients of sensitivity
#   (first, second and third order coefficients in this order)
#   of the count rate -> dose rate transformation [impulse/sec] -> [mGy/h].
#
# 'min_dose_rate' is the min dose rate under which the unit cannot be used
#   reliably for measurements [mGy/h].
#
# 'max_dose_rate' is the max dose rate above which the unit cannot be used
#   reliably for measurements [mGy/h].

zp1210.gpio_pin=-1
zp1210.gpio_edge=rising
zp1210.gpio_debounce=0
zp1210.gpio_mode=counter
zp1210.sensitivity=9.99e-5 -1.25e-9 1.06e-12
zp1210.min_dose_rate=0.0001
zp1210.max_dose_rate=1

zp1300.gpio_pin=-1
zp1300.gpio_edge=rising
zp1300.gpio_debounce=0
zp1300.gpio_mode=counter
zp1300.sensitivity=2.95e-2 -1.89e-7 1.72e-11
zp1300.min_dose_rate=1
zp1300.max_dose_rate=1000


[xbee]

# Filename of the serial port (UART) we use to communicate with XBee.
# Note: new generation drones (from ID 90 in the ELTE-CollMot flock) come with
# no XBee installed.
device{odroid-c1}=/dev/ttyS2
device{odroid-c1-linux4}=/dev/ttyAML2
device{rpi-zero-w}=
device{90-}=

# Baud rate
baud_rate=115200

# Assume that the XBee is already in API mode.
assume_api_mode=1


[radio]

# Filename of the serial port (UART) we use to communicate with the radio.
# Here we assume that a udev rule is set up that symlinks the appropriate
# device to /dev/sik-radio
device=/dev/sik-radio

# Baud rate
baud_rate=57600

# Mode: default (radio receives flockctrl commands) or mavlink (radio receives
# MAVLink commands that are to be forwarded to a MAVLink-compatible autopilot)
mode=default

# Whether to allow telemetry (and calibration progress) to be sent over the radio
telemetry_enabled=0

# Configuration settings to load into the EEPROM of the radio at first startup
# (or every time the value of this setting changes). Only the differences from
# the factory defaults have to be specified explicitly.
#
# Should be used for radios running the ArduPilot SiK firmware only. Leave it
# empty if you are using another telemetry radio.
#
# Only numbers, spaces and equal signs are treated by the parser; additional
# characters may be added for sake of readability but they are stripped before
# parsing
configuration=S3:NETID=47, S5:ECC=1, S6:MAVLINK=0, S7:OPPRESEND=1, S11:DUTY_CYCLE=0


[indoor_nav]

# Whether we are going to use indoor navigation
active=0

# Type of the indoor navigation device to use
method=pozyx

# Origin of the indoor coordinate system, in GPS coordinates (lat-lon-AHL)
# Altitude will always be parsed as relative, AMSL altitudes are not used here.
# Leaving the origin empty is okay as long as you don't activate the indoor
# navigation. You need to set it to _something_ once you set indoor_nav.active
# to 1
origin=

# Handedness of the coordinate system. Accepted values: left, right, neu, nwu.
# neu is the same as left; nwu is the same as right.
# The default is NWU because that matches Blender conventions.
handedness=nwu

# Orientation of the X axis of the indoor coordinate system, in degrees. Zero
# means North, 90 means East, 180 means South, 270 means West.
orientation=0


[indoor_nav.pozyx]

# Filename of the I2C bus device where the Pozyx tag is connected
device{odroid-c1}=/dev/i2c-1
device{odroid-c1-linux4}=/dev/i2c-0

# I2C slave address (7-bit) of the Pozyx tag
i2c_address=0x4b

# Specifies an anchor to use and its position in local coordinates (X, Y, Z).
# Coordinates are expressed in meters.
# Uncomment and add as many entries as the number of anchors in your setup.
# anchor=0x1234 1.11 2.22 3.33


[wireless]

# Subnet where the flock "lives" in the IPv4 address space. flockctrl will look
# for a network interface with an IP address in this subnet and broadcast
# packets to this subnet. The subnet must be specified in standard IPv4
# dotted-and-slashed notation. Use 0.0.0.0/0 if you want to allow any subnet.
subnet=10.0.0.0/8

# Port where flockctrl will listen for inbound status packets on the broadcast
# address. This is assumed to be the same for all UAVs in the flock. Setting
# the port to zero will turn off the wifi network between UAVs.
port=4243

# Additional port where flockctrl will listen for inbound command packets on
# its own IP address (_not_ the broadcast address). When missing or zero, it
# is assumed to be the same as the port used for listening for broadcast
# packets (see the 'port' setting above).
#
# Typically you don't have to touch this setting, unless you are running
# multiple flockctrl instances on the same machine for simulation purposes.
# In this case, set the 'port' setting the same for all instances, but use a
# unique 'unicast_port'.
unicast_port=0

# Base transmission period for wifi [s]
base_tx_period=0.1

# Multiplying this value with the base transmission period will give
# us the transmission time period for status packets over wifi.
# The value must be a positive integer. Setting it to zero will disable
# status packets.
status_packet_tx_period_multiplier=1

# Multiplying this value with the base transmission period will give
# us the transmission time period for extended status packets over wifi.
# The value must be a positive integer. Setting it to zero will disable
# extended status packets.
extended_status_packet_tx_period_multiplier=1

# Multiplying this value with the base transmission period will give
# us the transmission time period for prearm status packets over wifi.
# The value must be a positive integer. Setting it to zero will disable
# prearm status packets.
prearm_status_packet_tx_period_multiplier=1

# Multiplying this value with the base transmission period will give
# us the transmission time period for mission info packets over wifi.
# The value must be a positive integer. Setting it to zero will disable
# mission info packets.
mission_info_packet_tx_period_multiplier=50

# Multiplying this value with the base transmission period will give
# us the transmission time period for mission status packets over wifi.
# The value must be a positive integer. Setting it to zero will disable
# mission status packets.
mission_status_packet_tx_period_multiplier=0

# Multiplying this value with the base transmission period will give
# us the transmission time period for proximity sensor packets over wifi.
# The value must be a positive integer. Setting it to zero will disable
# proximity sensor packets.
proximity_status_packet_tx_period_multiplier=0

# Multiplying this value with the base transmission period will give
# us the transmission time period for sprayer status packets over wifi.
# The value must be a positive integer. Setting it to zero will disable
# sprayer status packets.
sprayer_status_packet_tx_period_multiplier=0


[prearm]

# Maximum discrepancy between the measured length of the gravity vector
# and the expected length (9.81 m/s/s), in [m/s/s]. The drone will not
# take off if the difference between the measured and the expected length
# is larger than this value.
gravity_vector_length_tolerance=1

# Relative altitude tolerance, in [m]. The drone will not take off
# if its relative altitude is higher than this value.
relative_altitude_tolerance=5

# Tolerance threshold in takeoff placement, in [m]. The drone will not take off
# if it is placed farther than this distance from its takeoff position.
# The desired takeoff position needs to be set explicitly by the current algorithm.
# If it is not set, the tolerance is measured from the home position.
takeoff_placement_tolerance=5

# Maximum tilt angle (calculated from roll/pitch) allowed before takeoff.
# Use a value of 0 to disable the tilt angle prearm check.
takeoff_tilt_angle_tolerance=45

# Number of compasses that need to be onboard. Set to 0 to disable the compass
# number prearm check.
number_of_compasses_present=0


[slow_flight_mode]

# Horizontal distance from home and altitude above home below which slow flight mode is
# automatically activated (if both are met) [m].
radius_around_home=0
altitude_above_home=0

# Altitude above ground (if down proximity sensor is used) below which slow flight mode
# is automatically activated.
altitude_above_ground=0

# Radius around detected objects (if front proximity sensor is used) below which
# slow flight mode is automatically activated.
radius_around_objects=0

# Maximal horizontal velocity in slow flight mode [m/s].
velocity_xy=1

# Maximal vertical velocity in slow flight mode [m/s].
velocity_z_up=0.5
velocity_z_down=0.5


[failsafe]

# In case of being close to a (so far only frontal) object in the air without
# manual intervention, emergency algo is triggered after the given time [s].
# Use negative values to disable proximity failsafe.
proximity_failsafe_time=-1

# Distance value for proximity failsafe under which an object is treated as
# being close enough to trigger the failsafe mechanism [m]
proximity_failsafe_distance=5

# In case of RC signal lost, emergency algo is triggered only after this time [s]
# Make sure to enable emergency's try_return_to_home for RC signal lost cases.
rc_failsafe_time=10

# Specifies a percentage level under which lowbat error is activated [%].
# Set to 0 or negative to disable setting up low battery percentage handling.
# Note that the low-level autopilot can have its own low level battery check.
low_bat_percentage=0

# Specifies a multiplier value for linearly increasing low bat voltage
# with growing distance from home or closest rally position [%/m].
low_bat_percentage_distance_multiplier=0

# Specifies a voltage level under which lowbat error is activated [V].
# Set to 0 or negative to disable setting up low battery voltage handling.
# Note that the low-level autopilot can have its own low level battery check.
low_bat_voltage=10.5

# Specifies a multiplier value for linearly increasing low bat voltage
# with growing distance from home or closest rally position [V/m].
low_bat_voltage_distance_multiplier=0

# Specifies a voltage level under which critical error is activated [V].
# Set to 0 or negative to disable setting up critical battery voltage handling.
# Note that this setting will be forwarded to the low-level autopilot to
# perform critical battery voltage handling there. Critical voltage level
# error handling is enforced to be "land immediately".
critical_bat_voltage=9.9

# Specifies the maximum distance from home a UAV can go. If the UAV gets
# outside this range, emergency algo is triggered. Value is in [m].
# Note that the low-level autopilot can have its own flying range check.
max_flying_range=300

# Specifies the maximum height from home a UAV can go. If the UAV gets
# above this height, emergency algo is triggered. Value is in [m].
# Note that the low-level autopilot can have its own flying height check.
max_flying_height=300

# The flying zone file that contains a registry of possible flying zones that
# we can refer to in our configuration files (in the flyingzone setting of the
# [failsafe] section) without explicitly defining the zone in the mission.
#
# If we are outside the flying zone, emergency landing is triggered.
#
# An error is triggered if the configuration files refer to a flying zone by
# name but no flying zone file is specified.
flyingzone_file=~/.flockctrl/flyingzone.cfg

# Define the section of the flyingzone file to use. Different sections can
# contain independent flying zone polygons.
#
# Leave it empty (or undefined) if you don't want to use a flying zone.
flyingzone=

# Distance to keep from inner and outer flyingzone boundaries, in [m].
# This value is treated internally as a padding offset value with which
# the outer boundary of the flyingzone gets deflated and the exclusion
# zones inside get inflated when converting the flyingzone into areas to
# avoid by the flight algorithms. A minimum value of 1 meter is enforced.
flyingzone_padding=5

# Whether the outer and inner flyingzone boundaries should slow down and
# stop the UAV to prevent geofence breach. Setting does not affect path
# planning around possible exclusion zones that is in action at all times.
# Note that so far flyingzone avoidance is implemented at algorithm level.
flyingzone_avoidance=0

# Priority of rally points in the flyingzone definition. Set to 1 to
# treat home position as unsafe for landing (use only if rally points
# are properly defined in the flyingzone definition).
rally_priority=0

# Define maximal speed output that can be sent to the low-level autopilot [m/s].
flight_envelope_xy=15
flight_envelope_z=3


[settings]

# Altitude reference to use when working with vertical coordinates. Defining
# 'amsl' instead of the default 'home' will calculate vertical distance from
# home and from other boids based on the AMSL values of position packets coming
# from the autopilots of self and other boids. Use 'amsl' only if this altitude
# source is reliable and accurate enough (e.g. with RTK GPS). Use 'home' only
# if your takeoff area is flat and thus AHL values of different boids will refer
# to the same absolute altitude.
altitude_reference=home

# Absolute direction for pitch in carefree mode (0-360) [deg],
# or -1 if carefree mode is not used.
carefree_mode_angle=-1

# Specifies a choreography file to use. When the choreography is iterated,
# new settings are loaded from it. If commented out, no choreography is used.
choreography_file=~/.flockctrl/choreography.cfg

# Specify the magnetic declination to be used in [rad]. The declination value
# will be forwarded to pixhawk autopilot during initialization (as COMPASS_DEC).
# If declination is set exactly to zero, it will be calculated automatically
# from a declination database (COMPASS_AUTODEC will be set to 1).
declination=0

# If specified, home position will be locked to the given values horizontally,
# vertically or both. If only one parameter is given, it should be altitude,
# if two, they should be latitude and longitude, if three, they should be
# latitude, longitude and altitude. Latitude should always be preceded by N|S,
# longitude with E|W, altitude with U|D.
home_position=


[rc]

# Specifies which RC channel and in what state can be used to
# activate/deactivate our flocking algorithms.
# A negative channel means that the master switch will be disabled and
# our own algorithm will always be activated.
# Three numbers are required in 1-based indexing: channel states enable
master_switch=5 6 3
master_switch{autopilot.type:dji_a3}=5 3 1

# Specifies which switch and in how many states can be used to
# select between flocking algorithms.
# A negative channel means that the algorithm selector switch will be disabled
# and the default algorithm given by the "default" key in the [algorithm]
# section will be used.
# Two numbers are required in 1-based indexing: channel states
algorithm_switch=-1 6

# Specifies which RC channel and in what state can be used to
# enable/disable the manual algo.
# A negative channel means that the manual switch will be disabled.
# Three numbers are required in 1-based indexing: channel states enable
manual_switch=-1 2 2

# Specifies which RC channel and in what state can be used to
# enable/disable the return to home algo.
# A negative channel means that the rth switch will be disabled.
# Three numbers are required in 1-based indexing: channel states enable
rth_switch=8 2 2
rth_switch{autopilot.type:dji_a3}=-1 2 2

# Specifies which RC channel and in what state can be used to
# step the choreography forward.
# A negative channel means that the choreography switch is disabled.
# Three numbers are required in 1-based indexing: channel states enable
choreography_switch=7 2 2
choreography_switch{autopilot.type:dji_a3}=-1 2 2

# Specifies which RC channel and in what state can be used to
# enable pyro triggering. Note that 'enable' does not mean triggering of the
# pyro as it is done by ledctrl bytecode.
# A negative channel means that the pyro switch is disabled (and thus pyro is
# disabled as well).
# Three numbers are required in 1-based indexing: channel states enable
pyro_switch=-1 2 2

# Specifies which RC channel and in what state can be used to
# enable the slow flight mode
# Three numbers are required in 1-based indexing: channel states enable
slow_flight_mode_switch=-1 2 2

# Specifies which RC channel and in what state can be used to arm/enable a
# sprayer payload. Note that 'enable' does not necessary mean triggering, the
# actual behaviour is based on the 'sprayer_behaviour' configuration parameter.
# A negative channel means that the sprayer switch is disabled, which also means
# that the sprayer itself is disabled.
# Three numbers are required in 1-based indexing: channel states enable
sprayer_switch=-1 2 2

# Specifies which RC channel and in what state can be used to suspend or resume
# the currently running algorithm without deactivating it.
# Three numbers are required in 1-based indexing: channel states enable
suspend_switch=-1 2 2

# The choreography switch can also act as a trigger for an auxiliary function
# when the master switch is off. This variable specifies what this auxiliary
# function will be; allowed values are: none (nothing), led_test (LED test),
# set_led_color_by_group (sets the LED color of all the drones with the same
# group index to the same value)
aux_function=led_test

# Gamma value used in the RC->velocity transfer function of manual control.
# Use values between [1, 5].
stick_to_velocity_gamma=1


[updates]

# Specifies whether over-the-air (OTA) updates are allowed
enabled=1

# Specifies a GPG keyring that is used for validating OTA updates. When this
# option is set, every update (placed in the inbox as update-v1.tar.gz or
# similar) must be accompanied with a GPG detached signature file whose name
# is identical to the name of the update file followed by ".sig". GPG will be
# invoked to verify the signature before the update is allowed to proceed.
#
# The keyring must be in GPG format (_not_ ASCII armored PGP). Use
# gpg -o keyring.gpg --export key_id to export in this format from another GPG
# keyring.
#
# Leave empty to disable GPG signature verification
keyring=


[algorithm_general]

# Specifies the list of algorithms assigned to the algorithm selector switch.
# Use max 6 algorithms, synchronize number with [rc] algorithm_switch_states
algorithms=dummy, manual

# Specifies the default algorithm to use if the algorithm selector switch is
# negative
default=manual

# Specifies the manual algorithm to use.
manual=manual

# Specifies the landing algorithm to use.
landing=landing

# Specifies the return_to_home algorithm to use.
return_to_home=return_to_home

# Specifies the emergency algorithm to use in case of emergency.
emergency=emergency

# Specifies whether algos delegated at the return to home / land priority level
# should trigger the currently used manual algo on in-air deactivation.
rth_or_land_deactivation_triggers_manual=0


[algorithm]

# Specify all algorithm-specific parameters here.

################################################################################

# Should we try to return to home / closest rally point before landing?
# Set to 1 to try return to home with simultaneous xy and z motion to home and
# desired altitude, or set to 2 to try raising to desired altitude first and
# try return to home horizontally only after that.
emergency.try_return_to_home=1

# Yaw rate of auto yawing towards next waypoint in [deg/s].
# If zero, auto yawing is disabled, except when frontal proximity sensor
# is used, in which case auto yawing is enforced regardless of this setting
emergency.auto_yaw_rate=0

# Minimum return to home altitude in [m]; if UAV is below this altitude, it will
# ascend to this height (as AHL) before returning home horizontally.
# If a down looking proximity sensor is used, safe distance from terrain is
# also kept using this height (as AGL) while returning home.
# Of course RTH during emergency is only available if try_return_to_home is set.
# Use values between 3 and 100 m.
emergency.minimum_rth_altitude=10

# Altitude strategy to follow when returning to home.
# Available strategies are "above_minimum" and "follow_terrain".
# The "above_minimum" strategy brings and keeps the UAV above the minimum altitude
# in AHL, and also keeps safety distance from terrain in AGL if a down looking
# proximity sensor is used. The "follow_terrain" strategy keeps the UAV exactly at
# the minimum altitude in AGL for terrain following. When AGL information is not available,
# strategy assumes a flat terrain and brings UAV home exactly at minimum altitude AHL.
emergency.altitude_strategy=above_minimum

# Tolerance level of waypoints to treat as reached [m].
emergency.tolerance_xy=3
emergency.tolerance_z=1.5

# Acceleration limit used both in the xy and z directions [m/s/s].
emergency.acceleration_xyz=2.5

# Horizontal and vertical speed [m/s].
emergency.velocity_xy=4
emergency.velocity_z=1

# radius of deadzone around target in which there is no attraction [m].
emergency.deadzone_xy=0
emergency.deadzone_z=0.2

# deadzone of other boids, i.e. radius offset (relative to repulsion range)
# for the reduction of the spp terms towards others [m].
emergency.r0_offset_spp=2

# gain determining steepness (crossover from lin to sqrt) of the
# vel_decay_in_space_linsqrt function [1/s].
# Set p=0.4-0.5 as a good default value.
emergency.vel_decay_p=0.5

# Number of seconds to wait before triggering the landing algorithm
# after returning to home
emergency.delay_before_landing=3

# If defined (>0), interaction (pairpot and damping)
# is made between units only if the separation in the vertical direction is
# smaller than this value [m].
emergency.vertical_interaction_range=7

# Maximum xy and z velocity fed to the velocity controller [m/s]
# If final output is greater than maximum velocity horizontally or vertically,
# it is truncated while maintaining vector direction.
emergency.velocity_threshold_xy=5
emergency.velocity_threshold_z=2.5

# repulsion parameters
emergency.v_rep=100
emergency.r0_rep=10
emergency.p_rep=2

# friction parameters
emergency.v_frict=0.2
emergency.r0_offset_frict=6
emergency.p_frict=1
emergency.acc_frict=3

################################################################################

# Yaw rate of auto yawing towards next waypoint in [deg/s].
# If zero, auto yawing is disabled, except when frontal proximity sensor
# is used, in which case auto yawing is enforced regardless of this setting
return_to_home.auto_yaw_rate=0

# Minimum return to home altitude in [m]; if UAV is below this altitude, it will
# ascend to this height (as AHL) before returning home horizontally.
# If a down looking proximity sensor is used, safe distance from terrain is
# also kept using this height (as AGL) while returning home.
# Use values between 3 and 100 m.
return_to_home.minimum_altitude=10

# Altitude strategy to follow when returning to home.
# Available strategies are "above_minimum" and "follow_terrain".
# The "above_minimum" strategy brings and keeps the UAV above the minimum altitude
# in AHL, and also keeps safety distance from terrain in AGL if a down looking
# proximity sensor is used. The "follow_terrain" strategy keeps the UAV exactly at
# the minimum altitude in AGL for terrain following. When AGL information is not available,
# strategy assumes a flat terrain and brings UAV home exactly at minimum altitude AHL.
return_to_home.altitude_strategy=above_minimum

# Tolerance level of waypoints to treat as reached [m].
return_to_home.tolerance_xy=1
return_to_home.tolerance_z=1

# Acceleration limit used both in the xy and z directions [m/s/s].
return_to_home.acceleration_xyz=2.5

# Horizontal and vertical speed [m/s].
return_to_home.velocity_xy=4
return_to_home.velocity_z=1

# radius of deadzone around target in which there is no attraction [m].
return_to_home.deadzone_xy=0.1
return_to_home.deadzone_z=0.2

# deadzone of other boids, i.e. radius offset (relative to repulsion range)
# for the reduction of the spp terms towards others [m].
return_to_home.r0_offset_spp=2

# gain determining steepness (crossover from lin to sqrt) of the
# vel_decay_in_space_linsqrt function [1/s].
# Set p=0.4-0.5 as a good default value.
return_to_home.vel_decay_p=0.5

# What to do when we arrive home?
# Possible values: 'loiter', 'land'
return_to_home.whats_next=land

# Number of seconds to wait before triggering the landing algorithm if
# whats_next is set to 'land'
return_to_home.delay_before_landing=3

# If defined (>0), interaction (pairpot and damping)
# is made between units only if the separation in the vertical direction is
# smaller than this value [m].
return_to_home.vertical_interaction_range=7

# Maximum xy and z velocity fed to the velocity controller [m/s]
# If final output is greater than maximum velocity horizontally or vertically,
# it is truncated while maintaining vector direction.
return_to_home.velocity_threshold_xy=5
return_to_home.velocity_threshold_z=2.5

# repulsion parameters
return_to_home.v_rep=100
return_to_home.r0_rep=8
return_to_home.p_rep=2

# friction parameters
return_to_home.v_frict=0.2
return_to_home.r0_offset_frict=2
return_to_home.p_frict=1
return_to_home.acc_frict=3

################################################################################

# Acceleration limit used both in the xy and z directions [m/s/s].
landing.acceleration_xyz=2.5

# gain determining steepness (crossover from lin to sqrt) of the
# vel_decay_in_space_linsqrt function [1/s].
# Set p=0.4-0.5 as a good default value.
landing.vel_decay_p=0.5

# Max horizontal speed [m/s].
landing.velocity_xy=2

# radius of deadzone around target in which there is no attraction [m].
landing.deadzone_xy=0

# Maximum velocity components reachable with manual intervention [m/s].
landing.max_manual_velocity_xy=3
landing.max_manual_velocity_z=2

# Fixed yaw/heading to turn to at the beginning of landing (0-360) [deg],
# or -1 if fixed yaw is not used
landing.fixed_yaw=-1

# Rotation speed of yaw if fixed_yaw is used [deg/s].
landing.fixed_yaw_rate=40

# Parameters of the guided-mode descent phase.
landing.state_guided_min_alt=10
landing.state_guided_velocity_z=2

# Lighting style of the algo. Possible values are 'none', 'off' and
# 'phases'. In the latter mode guided descent is blue, pixhawk descent is red
# and landed state is green.
landing.lighting=phases

################################################################################

# Acceleration limit used both in the xy and z directions [m/s/s].
planding.acceleration_xyz=2.5

# gain determining steepness (crossover from lin to sqrt) of the
# vel_decay_in_space_linsqrt function [1/s].
planding.vel_decay_p=2

# Max horizontal speed [m/s].
planding.velocity_xy=4

# radius of deadzone around target in which there is no attraction [m].
planding.deadzone_xy=0

# Maximum velocity components reachable with manual intervention [m/s].
planding.max_manual_velocity_xy=4
planding.max_manual_velocity_z=2

# Type of the landing target. Possible options: plain, boid, zone, visual.
# 'plain': land on a simple plain position initialized at algo activation
# 'boid': land dynamically to the position of another boid
# 'zone': land to a static target predefined in the flyingzone definition
# 'visual': land on a visual marker detected by visualctrl
# If landing on another boid or a predefined flyingzone target, do not forget
# to set target_boid_index as well.
planding.target_type=plain

# Index of the boid / flyingzone target being the (dynamic or static) landing target.
# Use together with target_type to choose between target types.
# Does not have any effect if target_type is not another boid or flyingzone target.
planding.target_boid_index=0

# Relative position offset from the current target to move to in the first phase,
# expressed in relative-NEU coordinates, i.e., relative to target's heading, namely:
# x+: front, y+: right, z+: up, in [m].
planding.target_pos_offset=0 0 0

# Relative position offset from the current target to move to in the second, catch phase,
# expressed in relative-NEU coordinates, i.e., relative to target's heading, namely:
# x+: front, y+: right, z+: up, in [m].
planding.target_catch_offset=0 0 0

# Relative position offset from the current target to land to in the third, land phase,
# expressed in relative-NEU coordinates, i.e., relative to target's heading, namely:
# x+: front, y+: right, z+: up, in [m].
planding.target_land_offset=0 0 0

# Relative heading offset added to target's yaw when calculating the conversion
# from the relative coordinate system of target_pos_offset and target_catch_offset
# into absolute coordinates, in [deg].
planding.target_heading_offset=0

# Maximum position error we allow at catch level for descent [m], and
# maximum position error growth rate with altitude up from catch level [m/m].
# These variables create a virtual funnel in which we can descent.
# Descent speed inside the funnel grows linearly from zero at funnel edge to
# maximum allowed vertical velocity at zero horizontal position error.
planding.max_pos_error_at_ground=0.05
planding.pos_error_alt_rate=0

# Vertical speeds in the high (to offset) and low (to ground) alt phases [m/s].
# Note that in the "low alt phase", vertical velocity is not decreased any more
# based on horizontal position error in order to have a definite down velocity
# when touching the ground.
planding.high_alt_velocity_z=2
planding.low_alt_velocity_z=0.8

# Yaw rate of auto yawing towards offset/catch/target in [deg/s].
# If zero, auto yawing is disabled.
planding.auto_yaw_rate=0

# Link between the planding phases (to_offset or to_ground) and a poti.
# Provide a 1-based channel index or 0 to disable link.
planding.pot_link.phase=6

# Lighting style of the algo. Possible values are 'none', 'off' and
# 'phases'. In the latter mode high alt (to offset) descent is blue,
# low alt (to catch) descent is purple, final descent to ground is red,
# disarming period is yellow and landed state is green.
planding.lighting=phases


################################################################################

# Index of the boid being the global target for self.
# If zero or negative, static target points from current flying zone
# are used with zero based indexing of the value abs(index)
flocking.target_boid_index=4

# Relative position offset from the current target, expressed in global
# coordinates (x+:N, y+:E, z+:U) [m].
flocking.target_pos_offset=0 0 0

# Where do we get the altitude reference from?
# Possible values: 'home', 'target'
flocking.altitude_reference=home

# Minimum altitude for the "flocking" algorithm, in [m].
# The velocity controller will kick in once this altitude is reached; this is to
# prevent large pitch/roll values while being close to the ground during ascent.
flocking.minimum_altitude=3

# Desired altitude for the "flocking" algorithm, in [m].
# If value is set to 0, desired altitude is automatically defined
# from code so that different boids in the flock have different values.
# This is an easy way to prevent accidental crashes in the x-y plane...
flocking.altitude_setpoint=0

# Link between the repulsion distance r0 [m] and a poti.
# format: channel min max, where channel is 1-based.
# Be careful not to set too small (<8) or too large (>20) values...
#flocking.pot_link.r0=6 5 20

# Defines the flight shape of the flock.
# Possible values: grid (default), ring, line, fixed
flocking.shape=grid

# Acceleration limit used both in the xy and z directions [m/s/s].
flocking.acceleration_xyz=2.5

# Horizontal and vertical speed [m/s].
flocking.velocity_xy=2.5
flocking.velocity_z=2

# Maximum velocity components reachable with manual intervention [m/s].
flocking.max_manual_velocity_xy=4
flocking.max_manual_velocity_z=2

# radius of deadzone around target in which there is no attraction [m].
flocking.deadzone_xy=2
flocking.deadzone_z=0.2

# gain determining steepness (crossover from lin to sqrt) of the
# vel_decay_in_space_linsqrt function [1/s].
# Set p=0.4-0.5 as a good default value.
flocking.vel_decay_p=0.5

# repulsion parameters
flocking.v_rep=100
flocking.r0_rep=10
flocking.p_rep=1.5

# friction parameters
flocking.v_frict=0.2
flocking.r0_offset_frict=1
flocking.p_frict=1
flocking.acc_frict=3

# Angle of the flock [deg] in case it is relevant (e.g. for shape line)
# Use range of [0,360] or set to -1 to have dynamic/autonomous calculation:
# -1 = dynamic/autonomous, 0 = North, 90 = East, 180 = South, 270 = West
flocking.flock_angle=0

# Vertical angle of the flock [deg] in case it is relevant (e.g. for shape line)
# Use range of [0,45] in [deg], where 0 is horizontal, 45 is half-way vertical.
# Set to -1 to disable pitching the flock.
flocking.flock_vangle=0

# The ring shape can rotate around its center with a given velocity, if needed.
# Do not set too high values, use range of e.g. [-2,2] m/s.
# Also pay attention not to exceed or even get close to velocity_threshold
# with vel_decay_v0 + tangential_velocity + pair_pots because the rotational
# motion will become jammed in the direction of flock motion.
flocking.tangential_velocity=1

# If there are multiple ring layers defined with different desired altitudes
# on the same target, we can have each one moving in opposite
# directions. For this, set height to a positive value [m] and carefully
# harmonize with desired altitudes and vertical_interaction_range.
# e.g. to have layers at desired altitudes 10m, 20m, 30 m,
# set offset=5m, height=10m, vertical_interaction_range=8m
# approximately and profit.
flocking.ring_reverse_layer_height=0
flocking.ring_reverse_layer_offset=0

# The ring shape is a spiral if a nonzero pitch is defined [m/2pi].
flocking.spiral_pitch=0

# If defined (>0), interaction (pairpot, damping and formation)
# is made between units only if the separation in the vertical direction is
# smaller than this value [m].
flocking.vertical_interaction_range=0

# Should we enable the arena to keep UAVs together? If so, it should have
# been defined in the flyingzone config file.
flocking.arena_enable=0

# Arena parameters: TODO implement
#flocking.C_Shill=0
#flocking.V_Shill=0
#flocking.Alpha_Shill=0
#flocking.Gamma_Wall=0

# Yaw mode during flocking. Possible values:
# nop - yaw is not controlled by the algo
# average - yaw is averaged among agents
# follow - yaw follows target at all times dynamically
flocking.yaw_mode=nop

# Maximum velocity fed to the velocity controller [m/s]
# If velocity from pair potentials is greater than maximum velocity,
# it is truncated while maintaining vector direction.
flocking.velocity_threshold=5

# Lighting style of the algo. Possible values are 'none', 'off' and
# 'distance'.
flocking.lighting=none

###########################################################################

# The waypoint file that defines the waypoints to fly.
# If commented out, no waypoints are flown and home position is kept.
waypoint.file=~/.flockctrl/waypoints.cfg

# Tolerance level around a waypoint to treat as reached [m].
# Tolerance in normal mode is calculated along waypoint line only.
# Tolerance perpendicular to it is checked by `maximum_deviation_xyz`.
# Tolerance in timeline mode is only based on time, not distance.
waypoint.tolerance_xyz=1

# Maximum deviation from waypoint line above which the drift status flag
# is set [m]. In normal mode deviation is calculated only perpendicular to
# waypoint line, in timeline mode deviation is calculated both along and
# perpendicular to it. Set to 0 to disable maximum deviation check.
waypoint.maximum_deviation_xyz=3

# Minimum altitude for the "waypoint" algorithm, in [m]. After takeoff,
# the velocity controller will kick in once this altitude is reached; this is to
# prevent large pitch/roll values while being close to the ground during ascent.
waypoint.minimum_altitude=3

# Desired takeoff altitude for the "waypoint" algorithm, in [m].
waypoint.takeoff_altitude=5

# Acceleration limit used both in the xy and z directions [m/s/s].
waypoint.acceleration_xyz=2.5

# Horizontal and vertical travelling speed used in case it is not defined
# by individual waypoints explicitly [m/s].
waypoint.velocity_xy=4
waypoint.velocity_z=2

# radius of deadzone around target in which there is no attraction [m].
waypoint.deadzone_xy=0
waypoint.deadzone_z=0

# gain determining steepness (crossover from lin to sqrt) of the
# vel_decay_in_space_linsqrt function [1/s].
# Set p=0.4-0.5 as a good default value.
waypoint.vel_decay_p=0.5

# deadzone of other boids, i.e. radius offset (relative to repulsion range)
# for the reduction of the spp terms towards others [m].
waypoint.r0_offset_spp=2

# If defined (>0), interaction (pairpot and damping)
# is made between units only if the separation in the vertical direction is
# smaller than this value [m].
waypoint.vertical_interaction_range=0

# Maximum xy and z velocity fed to the velocity controller [m/s]
# If final output is greater than maximum velocity horizontally or vertically,
# it is truncated while maintaining vector direction.
waypoint.velocity_threshold_xy=6
waypoint.velocity_threshold_z=2

# Maximum xy and z velocity components reachable with manual intervention [m/s].
waypoint.max_manual_velocity_xy=4
waypoint.max_manual_velocity_z=2

# Define how the manual control sticks should interfere with waypoints flown.
# Possible values: stop (uav stops and triggers manual algorithm immediately),
# shift (manual control shifts the uav temporarily), shift_or_stop (with small
# stick deviation the uav shifts temporarily, with large stick deviation it
# stops and switches to manual algorithm), none (manual control is switched off
# and not taken into account)
waypoint.manual_override_rp=shift
waypoint.manual_override_throttle=shift

# Whether to start waypoint algo in manual override mode to force manual takeoff
# and initial manual navigation until manual override is cleared. If set, waypoint
# following can only be activated from the air; if started from the ground, it will
# switch to manual algo after prearm checking has passed. Clearing manual mode can
# typically be performed with the `go` command of the debug console.
waypoint.manual_start=0

# What to do when we arrive to last waypoint?
# Possible values: 'loiter', 'rth', 'land'
# Note that rth is not the return_to_home algo here but a next waypoint
# to home position. Loiter keeps self at last defined waypoint, land
# triggers landing algo.
waypoint.whats_next=rth

# repulsion parameters
waypoint.v_rep=100
waypoint.r0_rep=5
waypoint.p_rep=2

# friction parameters
waypoint.v_frict=0.2
waypoint.r0_offset_frict=2
waypoint.p_frict=1
waypoint.acc_frict=3

# use guiding light signals during preparation phase to see the status of
# prearm checks
waypoint.lighting=phases

# Desired content of the algorithm packet to be sent. Use a single string
# containing any of the following characters in any order:
#   s - sprayer status
#   t - GPS time of week
#   w - current waypoint index and percentage flown towards it
# Leave variable empty if you do not wish to send algorithm packets.
waypoint.algorithm_packet_structure=

###########################################################################

# The waypointcloud file that defines the waypointclouds to fly.
waypointcloud.file=~/.flockctrl/waypointclouds.cfg

# If a nonnegative value is defined, only a single waypointcloud will be used
# from the current waypointcloud file and no duration/mtc based iteration of
# waypointclouds will be possible. Use -1 to use all wpclouds.
waypointcloud.use_single_waypointcloud=0

# tolerance level around a waypoint to treat as reached [m]
waypointcloud.tolerance_xy=1
waypointcloud.tolerance_z=1

# Minimum altitude for the "waypointcloud" algorithm, in [m].
# The velocity controller will kick in once this altitude is reached; this is to
# prevent large pitch/roll values while being close to the ground during ascent.
waypointcloud.minimum_altitude=3

# Desired altitude for the "waypointcloud" algorithm, in [m].
# This altitude is set when waypoints are not flown.
waypointcloud.altitude_setpoint=5

# Acceleration limit used both in the xy and z directions [m/s/s].
waypointcloud.acceleration_xyz=2.5

# Horizontal and vertical speed [m/s].
waypointcloud.velocity_xy=4
waypointcloud.velocity_z=2

# Radius of deadzone around target in which there is no attraction [m].
waypointcloud.deadzone_xy=0
waypointcloud.deadzone_z=0.2

# Gain determining steepness (crossover from lin to sqrt) of the
# vel_decay_in_space_linsqrt function [1/s].
# Set p=0.4-0.5 as a good default value.
waypointcloud.vel_decay_p=0.5

# Deadzone of other boids, i.e. radius offset (relative to repulsion range)
# for the reduction of the spp terms towards others [m].
waypointcloud.r0_offset_spp=0

# If defined (>0), interaction (pairpot and damping)
# is made between units only if the separation in the vertical direction is
# smaller than this value [m].
waypointcloud.vertical_interaction_range=0

# Maximum velocity fed to the velocity controller [m/s]
# If velocity from pair potentials is greater than maximum velocity,
# it is truncated while maintaining vector direction.
waypointcloud.velocity_threshold=6

# Maximum velocity components reachable with manual intervention [m/s].
waypointcloud.max_manual_velocity_xy=4
waypointcloud.max_manual_velocity_z=2

# Define how the manual control sticks should interfere with waypoints flown.
# Possible values: stop (uav stops and hovers, further waypoints are cleared),
# shift (manual control shifts the uav temporarily), none (manual control is
# switched off and not taken into account)
waypointcloud.manual_override_rp=stop
waypointcloud.manual_override_throttle=shift

# repulsion parameters
waypointcloud.v_rep=100
waypointcloud.r0_rep=10
waypointcloud.p_rep=2

# friction parameters
waypointcloud.v_frict_xy=0.2
waypointcloud.v_frict_z=0.3
waypointcloud.r0_offset_frict=2
waypointcloud.p_frict=1
waypointcloud.acc_frict=3

# Lighting style of the algo. Possible values are 'none', 'off' and
# 'strobe_and_solid'.
waypointcloud.lighting=none

# Color definition for the 'strobe_and_solid' light scheme. Either enter
# an RGB color (0-255 in each channel) or set it to 'random'.
waypointcloud.lighting_color=255 255 255

###########################################################################

# The target distribution scenario. Possible values:
# random, edge, opposite_plane, same_plane, line, cross, star, manual
traffic.scenario=edge

# The obstacle/arena/object file that defines shape and parameters
# of geometric objects. We use this now for defining target distribution params.
traffic.scenario_file=~/.flockctrl/obstacles.cfg

# The name of the scenario object from the scenario_file that defines our
# target distribution. All other objects in the file will be treated as
# regular objects. So far scenario object should be a "square" or "rectangle"
# or "circle" or "ellipse" type object, with origin_type=N E.
traffic.scenario_object=square100m

# The number of vertical layers used in the motion planning. Layers are
# differentiated according to the direction towards the desired target.
# Layers are spaced at `2 * vertical_interaction_range` distance from each other,
# all at or above the given altitude setpoint.
# Possible values: 1, 2 or 3.
traffic.number_of_layers=1

# Minimum altitude for the "traffic" algorithm, in [m].
# The velocity controller will kick in once this altitude is reached; this is to
# prevent large pitch/roll values while being close to the ground during ascent.
traffic.minimum_altitude=3

# Desired altitude for the "traffic" algorithm, in [m].
# If value is set to 0, desired altitude is automatically defined
# from code so that different boids in the flock have different values.
# This is an easy way to prevent accidental crashes in the x-y plane...
traffic.altitude_setpoint=8

# Define a maximal time within which individual takeoff time is random [s].
# This is useful to avoid dense initial packing in the air.
traffic.random_takeoff_time=0

# Acceleration limit used both in the xy and z directions [m/s/s].
traffic.acceleration_xyz=2.5

# Horizontal and vertical speed [m/s].
traffic.velocity_xy=2.5
traffic.velocity_z=2

# radius of deadzone around target in which there is no attraction [m].
traffic.deadzone_xy=0
traffic.deadzone_z=0.2

# deadzone of other boids, i.e. radius offset (relative to repulsion range)
# for the reduction of the spp terms towards others [m].
traffic.r0_offset_spp=0

# gain determining steepness (crossover from lin to sqrt) of the
# vel_decay_in_space_linsqrt function [1/s].
# Set p=0.4-0.5 as a good default value.
traffic.vel_decay_p=0.5

# repulsion parameters
traffic.v_rep=100
traffic.r0_rep=11
traffic.p_rep=2

# friction parameters
traffic.v_frict=0.2
traffic.c_frict=1
traffic.r0_offset_frict=4
traffic.p_frict=1
traffic.acc_frict=3

# Balazs Boldizsar parameters for anisotropic rotational repulsion
traffic.anisotropy_rep=0
traffic.tangentiality_spp=0

# Balazs Boldizsar parameters for collective obstacle avoidance
traffic.intolerance=2
traffic.r0_obstacle=10

# Balazs Boldizsar parameters for queuing behaviour [m].
# If qir is set to 0, queuing is switched off completely.
traffic.qir=25

# If defined (>0), interaction (pairpot, damping and formation)
# is made between units only if the separation in the vertical direction is
# smaller than this value [m].
traffic.vertical_interaction_range=0

# Maximum velocity fed to the velocity controller [m/s]
# If velocity from pair potentials is greater than maximum velocity,
# it is truncated while maintaining vector direction.
traffic.velocity_threshold=5

# Tolerance level of waypoints to treat as reached [m].
traffic.tolerance_xy=1
traffic.tolerance_z=1

#traffic.max_manual_velocity_z=2
#traffic.max_manual_velocity_xy=4

# Lighting style of the algo. Possible values are 'none', 'off' and
# 'queue_reduce'.
traffic.lighting=none

################################################################################

# The model used. Possible values are spp_evol and spp_response.
vicsek_evol.model=spp_response

# The obstacle file that defines shape and parameters
# of geometric objects to avoid inside the arena.
vicsek_evol.obstacle_file=~/.flockctrl/obstacles.cfg

# Index of the boid being the global target for self.
# If zero or negative, static target points from current flying zone
# are used with zero based indexing of the value abs(index)
vicsek_evol.target_boid_index=0

# Where do we get the altitude reference from?
# Possible values: 'home', 'target'
vicsek_evol.altitude_reference=home

# Minimum altitude for the "vicsek_evol" algorithm, in [m].
# The velocity controller will kick in once this altitude is reached; this is to
# prevent large pitch/roll values while being close to the ground during ascent.
vicsek_evol.minimum_altitude=3

# Desired altitude for the "vicsek_evol" algorithm, in [m].
# If value is set to 0, desired altitude is automatically defined
# from code so that different boids in the flock have different values.
# This is an easy way to prevent accidental crashes in the x-y plane...
vicsek_evol.altitude_setpoint=8

# Define a maximal time within which individual takeoff time is random [s].
# This is useful to avoid dense initial packing in the air.
vicsek_evol.random_takeoff_time=0

# Link between the pair potential distance r0 [m] and a poti.
# format: channel min max, where channel is 1-based.
# Be careful not to set too small (<8) or too large (>20) values...
#vicsek_evol.pot_link.r0=6 5 15

# Defines the flight shape of the flock.
# Possible values: circle (default), ring, box
vicsek_evol.shape=circle

# Acceleration limit used both in the xy and z directions [m/s/s].
vicsek_evol.acceleration_xyz=2.5

# Horizontal and vertical speed [m/s].
vicsek_evol.velocity_xy=4
vicsek_evol.velocity_z=2

# radius of deadzone around target in which there is no attraction [m].
vicsek_evol.deadzone_xy=0
vicsek_evol.deadzone_z=0.2

# gain determining steepness (crossover from lin to sqrt) of the
# vel_decay_in_space_linsqrt function [1/s].
# Set p=0.4-0.5 as a good default value.
vicsek_evol.vel_decay_p=0.5

# If defined (>0), interaction (pairpot, damping and formation)
# is made between units only if the separation in the vertical direction is
# smaller than this value [m].
vicsek_evol.vertical_interaction_range=0

# Arena parameters: radius in [m], rotation from N towards E in [deg],
# width for the SPP_RESPONSE type algo in [m].
vicsek_evol.arena_radius=50
vicsek_evol.arena_angle=0
vicsek_evol.wall_width=50

# Achtung! The parameters listed below are only valid for SPP_EVOL and a
# 100m wide arena! (it is especially true for the shill parameters...)

# repulsion parameters
vicsek_evol.v_rep=100
vicsek_evol.r0_rep=11
vicsek_evol.p_rep=2

# friction parameters
vicsek_evol.c_frict=1
vicsek_evol.v_frict=0.2
vicsek_evol.r0_offset_frict=4
vicsek_evol.p_frict=1
vicsek_evol.acc_frict=3

# interaction with walls
vicsek_evol.v_shill=6
vicsek_evol.acc_shill=3
vicsek_evol.r0_offset_shill=5
vicsek_evol.p_shill=1

# spin / will parameters
vicsek_evol.will_lifetime=1
vicsek_evol.spin_lifetime=0.16
vicsek_evol.spin_coupling_strength=1400
vicsek_evol.max_spin=50

# Maximum velocity fed to the velocity controller [m/s]
# If velocity from pair potentials is greater than maximum velocity,
# it is truncated while maintaining vector direction.
vicsek_evol.velocity_threshold=5

# Lighting style of the algo. Possible values are 'none', 'off' and 'velocity'.
vicsek_evol.lighting=none


